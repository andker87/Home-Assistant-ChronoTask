name: Retag (temporaneo)

# Ricrea i tag sui commit riscritti, a nome andker87. Da rimuovere a fine uso.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Recreate tags
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for t in json.load(open('.github/retag.json')):
              env = dict(os.environ, GIT_COMMITTER_NAME='andker87',
                         GIT_COMMITTER_EMAIL='49446412+andker87@users.noreply.github.com')
              if t['type'] == 'tag':
                  if t['date']:
                      env['GIT_COMMITTER_DATE'] = t['date']
                  subprocess.run(['git', 'tag', '-f', '-a', '-F', '-', t['name'], t['sha']],
                                 input=t['message'], text=True, env=env, check=True)
              else:
                  subprocess.run(['git', 'tag', '-f', t['name'], t['sha']], check=True)
          PY
          git push --force origin --tags
